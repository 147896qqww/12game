<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Slot Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .slot-card {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .spinning {
            animation: spinAnim 0.15s linear infinite;
        }
        @keyframes spinAnim {
            0% { transform: translateY(-10px); opacity: 0.5; }
            50% { transform: translateY(10px); opacity: 0.8; }
            100% { transform: translateY(-10px); opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans flex flex-col min-h-screen justify-between select-none">

    <!-- Top Bar -->
    <div class="p-3 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center sticky top-0 z-20">
        <a href="javascript:history.back()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-yellow-500 font-bold">← Home</a>
        <div class="text-center">
            <h1 class="text-sm font-black text-yellow-500 tracking-wider uppercase">SuperAce</h1>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-zinc-400">Balance</p>
            <p id="userBalanceDisplay" class="text-xs font-bold text-yellow-400">৳ 0</p>
        </div>
    </div>

    <!-- Multiplier Header -->
    <div class="p-3 bg-gradient-to-r from-yellow-600/20 via-yellow-500/10 to-yellow-600/20 border-y border-yellow-500/20 text-center flex justify-around items-center text-xs font-black">
        <span id="m1" class="px-2 py-1 bg-yellow-500 text-black rounded-md shadow">x1</span>
        <span id="m2" class="px-2 py-1 text-zinc-500">x2</span>
        <span id="m3" class="px-2 py-1 text-zinc-500">x3</span>
        <span id="m5" class="px-2 py-1 text-zinc-500">x5</span>
    </div>

    <!-- 4x5 Slot Grid -->
    <div class="p-2 my-auto">
        <div class="bg-zinc-900/90 border border-yellow-500/30 p-2 rounded-2xl shadow-2xl">
            <div id="slotGrid" class="grid grid-cols-4 gap-1.5">
                <!-- 20 Cards -->
            </div>
        </div>
    </div>

    <!-- Win & Bet Display -->
    <div class="bg-zinc-900/90 border-t border-zinc-800 p-3 flex justify-between items-center px-6">
        <div>
            <p class="text-[10px] text-zinc-400">WIN BDT</p>
            <p id="winDisplay" class="text-base font-extrabold text-green-400">0.00</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="changeBet(-10)" class="w-7 h-7 bg-zinc-800 border border-zinc-700 rounded-lg text-sm font-bold active:scale-95">-</button>
            <div class="text-center">
                <p class="text-[10px] text-zinc-400">BET BDT</p>
                <p id="betDisplay" class="text-xs font-bold text-yellow-400">10</p>
            </div>
            <button onclick="changeBet(10)" class="w-7 h-7 bg-zinc-800 border border-zinc-700 rounded-lg text-sm font-bold active:scale-95">+</button>
        </div>
    </div>

    <!-- Spin Control -->
    <div class="p-4 bg-zinc-900 border-t border-zinc-800 flex justify-center items-center">
        <button id="spinBtn" onclick="startSpin()" class="w-20 h-20 rounded-full bg-gradient-to-b from-yellow-400 via-yellow-500 to-amber-600 text-black font-black text-sm border-4 border-yellow-300 shadow-lg shadow-yellow-500/20 active:scale-90 transition transform flex items-center justify-center">
            SPIN
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlP4CMYbpWYq3EYBhCnLhwxRcGcEOMTUk",
            authDomain: "top-up-73e83.firebaseapp.com",
            databaseURL: "https://top-up-73e83-default-rtdb.firebaseio.com",
            projectId: "top-up-73e83",
            storageBucket: "top-up-73e83.firebasestorage.app",
            messagingSenderId: "30055612936",
            appId: "1:30055612936:web:ec146e10491422a0d987bd",
            measurementId: "G-MV24V93XQF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        let currentUserParam = urlParams.get('user');
        
        let storedUser = null;
        try {
            storedUser = JSON.parse(localStorage.getItem('currentUser'));
        } catch(e) {}

        const activeUsername = currentUserParam || (storedUser ? storedUser.username : null);

        let userBalance = 0;
        let currentBet = 10;
        let isSpinning = false;

        if (!activeUsername) {
            alert('Please login first on home page!');
        } else {
            db.ref('users/' + activeUsername + '/balance').on('value', (snap) => {
                userBalance = snap.val() || 0;
                document.getElementById('userBalanceDisplay').innerText = '৳ ' + userBalance;
            });
        }

        // Default fallback symbols with emojis incase database is empty
        let symbols = [
            { name: 'Ace', icon: '🃏', color: 'from-amber-500 to-yellow-600', val: 5 },
            { name: 'King', icon: '👑', color: 'from-purple-600 to-indigo-700', val: 3 },
            { name: 'Queen', icon: '👸', color: 'from-pink-600 to-rose-700', val: 2 },
            { name: 'Jack', icon: '⚔️', color: 'from-blue-600 to-cyan-700', val: 1.5 },
            { name: 'Wild', icon: '🌟', color: 'from-yellow-400 to-amber-500', val: 10 }
        ];

        // Fetch dynamic card images from Firebase Admin settings
        db.ref('superace_cards').on('value', (snap) => {
            const data = snap.val();
            if(data) {
                symbols = [
                    { name: 'Ace', img: data.ACE || '', color: 'from-amber-500 to-yellow-600', val: 5 },
                    { name: 'King', img: data.K || '', color: 'from-purple-600 to-indigo-700', val: 3 },
                    { name: 'Queen', img: data.Q || '', color: 'from-pink-600 to-rose-700', val: 2 },
                    { name: 'Jack', img: data.J || '', color: 'from-blue-600 to-cyan-700', val: 1.5 },
                    { name: 'Wild', img: data.SPADE || '', color: 'from-yellow-400 to-amber-500', val: 10 }
                ];
                initGrid();
            }
        });

        function initGrid() {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '';
            for(let i = 0; i < 20; i++) {
                const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                let content = randomSym.img ? `<img src="${randomSym.img}" class="w-10 h-10 object-contain">` : `<span class="text-xl">${randomSym.icon}</span>`;
                
                grid.innerHTML += `
                    <div id="card-${i}" class="slot-card h-14 bg-gradient-to-b ${randomSym.color} border border-yellow-400/40 rounded-xl flex flex-col justify-center items-center shadow-md">
                        ${content}
                        <span class="text-[9px] font-bold text-white/90">${randomSym.name}</span>
                    </div>
                `;
            }
        }
        initGrid();

        function changeBet(amt) {
            if(isSpinning) return;
            currentBet = Math.max(10, currentBet + amt);
            document.getElementById('betDisplay').innerText = currentBet;
        }

        function startSpin() {
            if(!activeUsername) {
                alert('Please login first on home page!');
                return;
            }

            if(isSpinning) return;
            if(userBalance < currentBet) {
                alert('Insufficient Balance!');
                return;
            }

            isSpinning = true;
            document.getElementById('winDisplay').innerText = '0.00';
            
            db.ref('users/' + activeUsername + '/balance').set(userBalance - currentBet);

            const grid = document.getElementById('slotGrid');
            const cards = grid.children;

            for(let card of cards) {
                card.classList.add('spinning');
            }

            setTimeout(() => {
                let winAmount = 0;
                let isWin = Math.random() < 0.45;

                for(let card of cards) {
                    card.classList.remove('spinning');
                }

                initGrid();

                if(isWin) {
                    const multiplier = [1.5, 2, 3, 5][Math.floor(Math.random() * 4)];
                    winAmount = currentBet * multiplier;
                    document.getElementById('winDisplay').innerText = winAmount.toFixed(2);
                    
                    db.ref('users/' + activeUsername + '/balance').set((userBalance - currentBet) + winAmount);
                }

                isSpinning = false;
            }, 1200);
        }
    </script>
</body>
</html>
